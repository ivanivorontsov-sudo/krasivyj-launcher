name: Release integrity audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-releases.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit release inventory without modifying releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Опубликованные релизы (ничего не удаляется):"
          gh release list --limit 100 --json tagName,name,publishedAt \
            --jq '.[] | [.tagName, (.name // ""), (.publishedAt // "")] | @tsv'

          latest_asset="$(gh release view latest --json assets --jq '.assets[].name' | grep -E '^uyut-launcher-.*\.apk$' | sort -V | tail -n 1 || true)"
          if [[ -z "$latest_asset" ]]; then
            echo "::error::В релизе latest не найден APK лаунчера"
            exit 1
          fi

          echo "Проверен APK в latest: $latest_asset"
          echo "Режим только для чтения: релизы, теги и файлы не изменяются."
