name: Build signed APK

on:
  push:
    branches: [main, release/1.4.7]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag / release branch / run number
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
            VERSION_CODE=$((MAJOR * 1000 + MINOR * 100 + PATCH * 10))
          elif [[ "$GITHUB_REF" == "refs/heads/release/1.4.7" ]]; then
            VERSION_NAME=1.4.7
            VERSION_CODE=1470
          else
            VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}-ci
            VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Restore release keystore (dedicated key, never debug)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/uyut-upload.jks
          echo "SIGNING_STORE_FILE=keystore/uyut-upload.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/release/1.4.7" || "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew --stacktrace testFullDebugUnitTest
          else
            ./gradlew --stacktrace testDebugUnitTest
          fi

      - name: Assemble signed release APKs
        if: github.event_name != 'pull_request'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF" == "refs/heads/release/1.4.7" || "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew --stacktrace assembleFullRelease assembleNowisdomRelease assembleLightRelease
            cp app/build/outputs/apk/full/release/app-full-release.apk "dist/SuperSmart-${VERSION_NAME}-full.apk"
            cp app/build/outputs/apk/nowisdom/release/app-nowisdom-release.apk "dist/SuperSmart-${VERSION_NAME}-bez-mudrosti.apk"
            cp app/build/outputs/apk/light/release/app-light-release.apk "dist/SuperSmart-${VERSION_NAME}-legkij.apk"
          else
            ./gradlew --stacktrace assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "dist/uyut-launcher-${VERSION_NAME}.apk"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for APK in dist/*.apk; do
            "$BT/apksigner" verify --print-certs "$APK" | tee "$APK.signature.txt"
            grep -i "SHA-256 digest: 73b837775d17eb48ca098de362d1dc1bc529ec351f82e67999444425868bce35" "$APK.signature.txt" \
              || { echo "::error::APK is not signed with the dedicated release key: $APK"; exit 1; }
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
          ls -lh dist

      # Keep the latest main-branch build directly downloadable.
      - name: Publish latest Android APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="dist/uyut-launcher-${VERSION_NAME}.apk"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK" --clobber
          else
            gh release create latest "$APK" --title "Уют — последняя сборка" --notes "Последний подписанный APK лаунчера Уют. Собран GitHub Actions из main."
          fi

      - name: Upload artifact (best effort)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: uyut-launcher-apk
          path: dist/*.apk
          retention-days: 7

      - name: Publish GitHub Release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS --title "СуперСмарт ${VERSION_NAME}" --notes-file RELEASE_NOTES.md
          fi

      # The release branch is used once to produce v1.4.7 from the last published source.
      - name: Publish v1.4.7 from release branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/1.4.7'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v1.4.7
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS --title "СуперСмарт 1.4.7" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
