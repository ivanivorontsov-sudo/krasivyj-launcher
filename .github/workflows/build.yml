name: Build signed APK

on:
  push:
    branches: [main, fix/settings-navigation-2026-10]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag / run number
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}-ci" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Restore release keystore (dedicated key, never debug)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/uyut-upload.jks
          echo "SIGNING_STORE_FILE=keystore/uyut-upload.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --stacktrace testReleaseUnitTest

      - name: Assemble signed release
        if: github.event_name != 'pull_request'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --stacktrace assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/uyut-launcher-${VERSION_NAME}.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "dist/uyut-launcher-${VERSION_NAME}.apk" | tee dist/signature.txt
          ls -l dist

      - name: Check signing certificate
        if: github.event_name != 'pull_request'
        run: |
          grep -i "SHA-256 digest: 73b837775d17eb48ca098de362d1dc1bc529ec351f82e67999444425868bce35" dist/signature.txt \
            || { echo "::error::APK is not signed with the dedicated release key"; exit 1; }

      # Artifact storage quota is exhausted until 2026-11-01: never fail the build because of it.
      - name: Upload artifact (best effort)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: uyut-launcher-apk
          path: dist/*.apk
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/fix/settings-navigation-2026-10')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="dist/uyut-launcher-${VERSION_NAME}.apk"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            RELEASE_TITLE="Уют ${VERSION_NAME}"
          else
            RELEASE_TAG="launcher-build-${GITHUB_RUN_NUMBER}"
            RELEASE_TITLE="Уют build ${GITHUB_RUN_NUMBER}"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file RELEASE_NOTES.md
          fi
